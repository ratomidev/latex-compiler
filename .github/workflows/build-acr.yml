name: Build and push to Azure Container Registry

on:
  workflow_dispatch:

env:
  REGISTRY: ryxregistry2.azurecr.io
  IMAGE: latex-compiler

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Free disk space (texlive-full is large)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force
          df -h /

      - uses: actions/checkout@v4

      - name: Log in to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build TeX base image
        run: docker build -f Dockerfile.base -t latex-base:latest .

      - name: Build compiler image
        run: |
          docker build --build-arg BASE_IMAGE=latex-base:latest \
            -t $REGISTRY/$IMAGE:latest \
            -t $REGISTRY/$IMAGE:${GITHUB_SHA::7} .

      - name: Push
        run: |
          docker push $REGISTRY/$IMAGE:${GITHUB_SHA::7}
          docker push $REGISTRY/$IMAGE:latest
